name: Bootstrap release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack release
        run: |
          unzip -q frosted-text-cards-github-release.zip -d .release
          rsync -a .release/frosted-text-cards-github/ ./
          rm -rf .release frosted-text-cards-github-release.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish frosted-text-cards skill"
          git push
