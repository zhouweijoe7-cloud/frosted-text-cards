name: Validate

on:
  push:
  pull_request:

jobs:
  render-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile renderer
        run: python -m py_compile scripts/render_cards.py scripts/render_palette_catalog.py
      - name: Render example
        run: python scripts/render_cards.py --input references/example-series.json --output output/ci --palette P12
      - name: Verify output
        run: test -f output/ci/contact-sheet.png
